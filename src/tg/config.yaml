# tg — default configuration (bundled)
# User overrides go to: ~/.config/tg/config.yaml
# Secrets are injected via bw-env (TELEGRAM_*_TOKEN, TG_API_ID, TG_API_HASH, CHAT_ID)

# default_bot: homelab       # auto-detected from TELEGRAM_*_TOKEN if not set
# default_chat: ""           # global CHAT_ID fallback (also read from env)

# Bot-specific defaults (tokens auto-loaded from env)
# bots:
#   homelab:
#     default_chat: ""       # override per-bot default chat_id
#   ubuntu:
#     default_chat: ""
#   n8n-homelab:
#     default_chat: ""

# Telethon user API credentials
# Prefer env vars: TG_API_ID, TG_API_HASH (injected by bw-env)
# user:
#   api_id: 12345            # from https://my.telegram.org → API development tools
#   api_hash: "abc123..."    # from https://my.telegram.org → API development tools
