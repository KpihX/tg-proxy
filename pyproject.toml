[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[project]
name = "tg"
version = "0.1.0"
description = "Telegram CLI — like gh for Telegram. Manages bots and conversations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "telethon>=1.36",
    "cryptg>=0.4",
]

[project.scripts]
tg = "tg.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[tool.uv_build]
package-dir = "src"
